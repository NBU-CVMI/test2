<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06080c">
  <title>历史会押韵吗｜互联网泡沫 × 创业板</title>
  <style>
    html,body{height:100%;margin:0;background:#06080c;color:#eef3fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .dot{width:42px;height:42px;margin:0 auto 18px;border:2px solid rgba(255,255,255,.12);border-top-color:#718fff;border-radius:50%;animation:spin .8s linear infinite}
    h1{font-size:20px;margin:0 0 8px}p{font-size:12px;line-height:1.7;color:#8591a4;margin:0}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div><div class="dot"></div><h1>正在载入动态行情</h1><p>每次打开都会重新请求最新交易日数据</p></div></div>
  <script>
    const source='https://raw.githubusercontent.com/NBU-CVMI/test2/h5-dotcom-chinext/h5/dotcom-chinext/index.html';
    fetch(source+'?v='+Date.now(),{cache:'no-store'})
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
      .then(html=>{document.open();document.write(html);document.close()})
      .catch(err=>{document.getElementById('loading').innerHTML='<div><h1>页面暂时加载失败</h1><p>请刷新页面重试。错误：'+String(err.message||err)+'</p></div>'});
  </script>
</body>
</html>
